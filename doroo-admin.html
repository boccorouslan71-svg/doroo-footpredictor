<style>
:root{
  --primary-gradient: linear-gradient(135deg,#00d98b 0%,#00b0a0 55%,#8fd94a 100%);
  --bg:#070b16;
  --bg-grad: radial-gradient(1100px 500px at 10% -10%, #16305a 0%, rgba(22,48,90,0) 55%), radial-gradient(900px 500px at 100% 0%, #0d3d34 0%, rgba(13,61,52,0) 50%), linear-gradient(180deg,#0a1120 0%,#05070f 100%);
  --text:#f4f7fb; --text-2:#8f9bb3; --text-3:#5c6780;
  --accent:#00ff9c; --gold:#ffd24a;
  --card: linear-gradient(160deg, rgba(24,34,58,0.92), rgba(12,18,34,0.92));
  --card-solid:#111a2e; --glow: rgba(0,255,156,0.22);
  --border: rgba(120,220,190,0.14); --border-strong: rgba(120,220,190,0.30);
  --danger:#ff5d73; --warn:#ffb020; --info:#4db5ff;
  --r:18px; --r-sm:12px; --sh: 0 10px 40px rgba(0,0,0,0.45); --side:250px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;color:var(--text);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;}
svg{display:block;}
.ico{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.ico-sm{width:16px;height:16px;} .ico-lg{width:26px;height:26px;}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:rgba(0,255,156,0.2);border-radius:10px;}
.hidden{display:none !important;} .muted{color:var(--text-2);} .t-accent{color:var(--accent);} .t-gold{color:var(--gold);} .t-danger{color:var(--danger);}
.row{display:flex;align-items:center;gap:10px;} .row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;} .wrap{flex-wrap:wrap;}
.glass{background:rgba(17,26,46,0.6);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--border);}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:16px;position:relative;overflow:hidden;}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.14),transparent);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:10px 16px;border-radius:var(--r-sm);font-weight:700;font-size:14px;color:#04140d;background:var(--primary-gradient);box-shadow:0 8px 22px var(--glow);transition:transform .12s,opacity .12s;}
.btn:active{transform:translateY(1px) scale(.99);} .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;} .btn .ico{stroke:#04140d;}
.btn-ghost{background:rgba(255,255,255,0.05);color:var(--text);border:1px solid var(--border);box-shadow:none;} .btn-ghost .ico{stroke:currentColor;}
.btn-danger{background:linear-gradient(135deg,#ff5d73,#b31f45);color:#fff;box-shadow:none;} .btn-danger .ico{stroke:#fff;}
.btn-warn{background:linear-gradient(135deg,#ffb020,#d97a00);color:#111;box-shadow:none;} .btn-warn .ico{stroke:#111;}
.btn-sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:10px;}
.btn-block{width:100%;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;}
.pill .ico{width:12px;height:12px;}
.pill.up{background:rgba(0,255,156,0.12);color:var(--accent);border:1px solid rgba(0,255,156,0.28);}
.pill.lock{background:rgba(255,176,32,0.12);color:var(--warn);border:1px solid rgba(255,176,32,0.28);}
.pill.info{background:rgba(77,181,255,0.12);color:var(--info);border:1px solid rgba(77,181,255,0.28);}
.pill.lose{background:rgba(255,93,115,0.12);color:var(--danger);border:1px solid rgba(255,93,115,0.28);}
.field{margin-bottom:13px;} .field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:var(--r-sm);background:rgba(255,255,255,0.035);border:1px solid var(--border);color:var(--text);outline:none;transition:border-color .15s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.field select option{background:#0d1322;color:#fff;} .field textarea{min-height:90px;resize:vertical;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;} .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.sect{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--text-2);margin:2px 0 13px;font-weight:800;display:flex;align-items:center;gap:8px;}
.sect .ico{width:16px;height:16px;stroke:var(--accent);}
.coin{display:inline-flex;align-items:center;gap:5px;font-weight:800;color:var(--gold);} .coin .ico{width:14px;height:14px;stroke:var(--gold);}
/* loader/login */
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--bg);background-image:var(--bg-grad);z-index:9999;}
.brand{display:flex;align-items:center;gap:11px;font-size:22px;font-weight:900;letter-spacing:.5px;}
.brand .logo{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--primary-gradient);box-shadow:0 8px 26px var(--glow);}
.brand .logo .ico{width:24px;height:24px;stroke:#04140d;stroke-width:2.2;}
.brand .txt{background:var(--primary-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.spinner{width:50px;height:50px;border-radius:50%;border:3px solid rgba(0,255,156,0.14);border-top-color:var(--accent);animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;}
.login-card{width:100%;max-width:390px;}
.login-badge{width:70px;height:70px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:var(--primary-gradient);box-shadow:0 14px 40px var(--glow);margin:0 auto 14px;}
.login-badge .ico{width:36px;height:36px;stroke:#04140d;stroke-width:2.1;}
.lang{display:inline-flex;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:999px;padding:3px;}
.lang button{min-height:28px;padding:2px 11px;border-radius:999px;background:transparent;color:var(--text-2);font-weight:800;font-size:12px;}
.lang button.active{background:var(--primary-gradient);color:#04140d;}
/* shell */
#shell{display:none;min-height:100vh;}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--side);padding:20px 14px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;z-index:40;border-right:1px solid var(--border);}
.sidebar .brand{font-size:18px;margin:2px 4px 18px;}
.navlink{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:12px;color:var(--text-2);font-weight:700;font-size:14px;background:transparent;text-align:left;width:100%;transition:.14s;}
.navlink .ico{width:19px;height:19px;}
.navlink:hover{background:rgba(255,255,255,0.04);color:var(--text);}
.navlink.active{background:var(--primary-gradient);color:#04140d;box-shadow:0 8px 20px var(--glow);}
.navlink.active .ico{stroke:#04140d;}
.navlink .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:800;min-width:20px;height:20px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 5px;}
.main{margin-left:var(--side);padding:20px 24px 60px;}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;margin:-20px -24px 20px;border-bottom:1px solid var(--border);}
.hamb{display:none;} 
.page-title{font-size:20px;font-weight:900;display:flex;align-items:center;gap:10px;} .page-title .ico{stroke:var(--accent);}
/* kpi */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:6px;}
.kpi{padding:17px;border-radius:16px;background:rgba(255,255,255,0.03);border:1px solid var(--border);position:relative;overflow:hidden;}
.kpi .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.kpi .ic .ico{width:20px;height:20px;}
.kpi .v{font-size:26px;font-weight:900;} .kpi .l{font-size:12px;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.chart-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
.chart-box{position:relative;height:300px;}
/* table */
.tablewrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px;}
th{text-align:left;padding:12px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-2);background:rgba(255,255,255,0.03);position:sticky;top:0;}
td{padding:11px 14px;border-top:1px solid var(--border);vertical-align:middle;}
tr:hover td{background:rgba(255,255,255,0.02);}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#04140d;font-size:13px;}
.searchbar{position:relative;display:flex;align-items:center;margin-bottom:14px;}
.searchbar .ico{position:absolute;left:13px;stroke:var(--text-3);} .searchbar input{width:100%;padding:11px 13px 11px 40px;border-radius:12px;background:rgba(255,255,255,0.035);border:1px solid var(--border);color:var(--text);outline:none;}
.actions{display:flex;gap:6px;flex-wrap:wrap;}
.iconbtn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text);}
.iconbtn.d{color:var(--danger);border-color:rgba(255,93,115,0.3);} .iconbtn.w{color:var(--warn);border-color:rgba(255,176,32,0.3);}
.iconbtn .ico{width:16px;height:16px;}
/* modal */
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(3,6,14,0.6);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);}
.modal{width:100%;max-width:460px;max-height:90vh;overflow-y:auto;border-radius:20px;background:var(--card-solid);border:1px solid var(--border);padding:20px;}
.modal h3{font-size:18px;margin-bottom:14px;display:flex;align-items:center;gap:9px;} .modal h3 .ico{stroke:var(--accent);}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:16px;z-index:2000;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;}
.toast{max-width:90vw;padding:11px 15px;border-radius:12px;font-size:13px;font-weight:600;background:rgba(17,26,46,0.97);border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;align-items:center;gap:9px;}
.toast .ico{width:17px;height:17px;} .toast.ok{border-color:rgba(0,255,156,0.5);} .toast.ok .ico{stroke:var(--accent);} .toast.err{border-color:rgba(255,93,115,0.55);} .toast.err .ico{stroke:var(--danger);}
.empty{text-align:center;color:var(--text-2);padding:40px 12px;} .empty .ico{width:44px;height:44px;stroke:var(--text-3);margin:0 auto 12px;}
.log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,0.25);border:1px solid var(--border);margin-bottom:7px;display:flex;gap:10px;}
.log .tm{color:var(--text-3);flex-shrink:0;} .log .ac{color:var(--accent);font-weight:700;}
@media(max-width:900px){
  :root{--side:0px;}
  .sidebar{transform:translateX(-100%);transition:transform .25s;width:250px;background:var(--card-solid);} .sidebar.open{transform:none;}
  .main{margin-left:0;padding:16px 15px 60px;} .topbar{margin:-16px -15px 16px;} .hamb{display:flex;}
  .kpi-grid{grid-template-columns:1fr 1fr;} .chart-grid,.grid2,.grid3{grid-template-columns:1fr;}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;}
}
</style>
</head>

<script>

   Revele l'ecran de connexion quoi qu'il arrive : erreur JS, CDN
   injoignable, ou callback Firebase qui ne se declenche pas.
   Enregistre AVANT toute la logique. */
(function(){
  function reveal(){
    var l=document.getElementById("loader"); if(!l) return;
    if(getComputedStyle(l).display==="none") return;        // deja masque
    var sh=document.getElementById("shell");
    if(sh && getComputedStyle(sh).display!=="none") return; // dashboard deja affiche
    l.style.display="none";
    var lg=document.getElementById("login"); if(lg) lg.classList.remove("hidden");
  }
  window.__dorooReveal=reveal;
  window.__dorooFailsafe=setTimeout(reveal,3500);
  window.addEventListener("error",function(){ setTimeout(reveal,300); });
  window.addEventListener("unhandledrejection",function(){ setTimeout(reveal,300); });
})();
</script>

/* ---- 5. MISSIONS ---- */
V.missions=function(){
  var h='<div class="card"><div class="row-between"><div class="sect" style="margin:0">'+ic("gift")+t("missionsTitle")+'</div><button class="btn btn-sm" onclick="Admin.openMission()">'+ic("plus","ico-sm")+t("newMission")+'</button></div></div>';
  var ms=normArr(State.missions);
  if(ms.length===0)return h+'<div class="card"><div class="empty">'+ic("gift")+'<div>'+t("noMissions")+'</div></div></div>';
  ms.forEach(function(m){ h+='<div class="card"><div class="row-between"><div class="row"><div class="av" style="width:40px;height:40px;border-radius:11px;background:rgba(0,255,156,0.1)">'+ic("target","ico-sm").replace('class="ico ico-sm"','class="ico ico-sm" style="stroke:var(--accent)"')+'</div><div><div style="font-weight:700">'+esc(m.title)+'</div><div class="muted" style="font-size:12px">'+esc(m.titleEn||"")+' · '+esc(m.url||"")+'</div></div></div><div class="row"><span class="coin">+'+m.reward+'</span>'+(m.active?'<span class="pill up">'+t("active")+'</span>':'<span class="pill lose">off</span>')+'<button class="iconbtn" onclick="Admin.openMission(\''+m.id+'\')">'+ic("edit","ico-sm")+'</button><button class="iconbtn d" onclick="Admin.deleteMission(\''+m.id+'\')">'+ic("trash","ico-sm")+'</button></div></div></div>'; });
  return h;
};

/* ---- 6. WITHDRAWALS ---- */
V.withdrawals=function(){
  var h='<div class="card"><div class="sect">'+ic("wallet")+t("wdTitle")+'</div>';
  var list=normArr(State.withdrawals).sort(function(a,b){ var o={pending:0,approved:1,rejected:2}; return (o[a.status]-o[b.status])||(b.ts-a.ts); });
  if(list.length===0)return h+'<div class="empty">'+ic("wallet")+'<div>'+t("noWd")+'</div></div></div>';
  h+='<div class="tablewrap"><table><thead><tr><th>'+t("user")+'</th><th>'+t("amount")+'</th><th>'+t("method")+'</th><th>'+t("details")+'</th><th>'+t("date")+'</th><th>'+t("status")+'</th><th>'+t("actions")+'</th></tr></thead><tbody>';
  list.forEach(function(w){ var stcl=w.status==="approved"?"up":w.status==="rejected"?"lose":"lock"; var act=w.status==="pending"?'<button class="btn btn-sm" onclick="Admin.approveWd(\''+w.id+'\')">'+ic("check","ico-sm")+t("approve")+'</button><button class="btn btn-sm btn-danger" onclick="Admin.rejectWd(\''+w.id+'\')">'+ic("x","ico-sm")+t("reject")+'</button>':'—'; h+='<tr><td><b>'+esc(w.username)+'</b></td><td><span class="coin">'+w.amount+'</span></td><td>'+esc(w.method)+'</td><td class="muted">'+esc(w.details)+'</td><td class="muted">'+fmtTime(w.ts)+'</td><td><span class="pill '+stcl+'">'+esc(w.status)+'</span></td><td><div class="actions">'+act+'</div></td></tr>'; });
  return h+'</tbody></table></div></div>';
};

/* ---- 7. BROADCAST ---- */
V.broadcast=function(){ var count=Object.keys(State.users||{}).filter(function(k){return State.users[k].username!=="admin";}).length;
  return '<div class="card"><div class="sect">'+ic("megaphone")+t("bcTitle")+'</div><div class="field"><label>'+t("bcTitleField")+'</label><input id="bcT" /></div><div class="field"><label>'+t("bcMsg")+'</label><textarea id="bcM"></textarea></div><div class="field"><label>'+t("bcImg")+'</label><input id="bcI" placeholder="https://…" /></div><button class="btn" onclick="Admin.broadcast()">'+ic("megaphone","ico-sm")+t("bcSend")+' ('+count+')</button></div>';
};

/* ---- 8. SETTINGS & LOGS ---- */
V.settings=function(){ var s=State.system||DEFAULT_SYSTEM;
  var h='<div class="card"><div class="sect">'+ic("cog")+t("setTitle")+'</div><div class="field"><label>'+t("tgChannel")+'</label><input id="sTg" value="'+esc(s.telegramChannel||"")+'" /></div><div class="field"><label>'+t("monetagZone")+'</label><input id="sMz" value="'+esc(s.monetagZone||"")+'" /></div><div class="grid2"><div class="field"><label>'+t("apiEnabled")+'</label><select id="sApiEn"><option value="1" '+(s.apiEnabled?"selected":"")+'>'+t("active")+'</option><option value="0" '+(!s.apiEnabled?"selected":"")+'>off</option></select></div><div class="field"><label>'+t("apiKey")+'</label><input id="sApiKey" value="'+esc(s.apiKey||"")+'" /></div></div><button class="btn" onclick="Admin.saveSettings()">'+ic("save","ico-sm")+t("saveSettings")+'</button></div>';
  h+='<div class="card"><div class="row-between"><div class="sect" style="margin:0">'+ic("list")+t("logs")+'</div><button class="btn btn-ghost btn-sm" onclick="Admin.clearLogs()">'+ic("trash","ico-sm")+t("clearLogs")+'</button></div><div style="margin-top:12px">';
  if(State.logs.length===0)h+='<div class="empty">'+ic("list")+'<div>'+t("noLogs")+'</div></div>';
  else State.logs.forEach(function(l){ h+='<div class="log"><span class="tm">'+fmtTime(l.ts)+'</span><span class="ac">'+esc(l.action)+'</span><span>'+esc(l.detail)+'</span></div>'; });
  return h+'</div></div>';
};
</script>
<script>
/* ============ MODAL HELPERS ============ */
function openModal(html){ $("modalHost").innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>'; }
function closeModal(){ $("modalHost").innerHTML=""; }

/* ============ USERS ACTIONS ============ */
Admin.openEditUser=function(uid){ var u=State.users[uid]; if(!u)return; State.editUser=uid; openModal('<h3>'+ic("edit")+t("editBalance")+' — '+esc(u.username)+'</h3><div class="field"><label>'+t("newBalance")+'</label><input id="euBal" type="number" value="'+Math.round(u.coins||0)+'" /></div><div class="row"><button class="btn" onclick="Admin.saveUser()">'+ic("save","ico-sm")+t("save")+'</button><button class="btn btn-ghost" onclick="closeModal()">'+t("cancel")+'</button></div>'); };
Admin.saveUser=function(){ var uid=State.editUser, val=parseInt($("euBal").value,10)||0; DBX.update("users/"+uid,{coins:val}).then(function(){ logAction("EDIT_BALANCE",State.users[uid].username+" -> "+val); toast(t("userUpdated"),"ok"); closeModal(); }); };
Admin.toggleBan=function(uid){ var u=State.users[uid]; var nb=!u.banned; DBX.update("users/"+uid,{banned:nb}).then(function(){ logAction(nb?"BAN":"UNBAN",u.username); toast(nb?t("userBanned"):t("userUnbanned"),"ok"); }); };
Admin.deleteUser=function(uid){ if(!confirm(t("confirmDelete")))return; var name=State.users[uid].username; DBX.remove("users/"+uid).then(function(){ logAction("DELETE_USER",name); toast(t("userDeleted"),"ok"); }); };

/* ============ MATCHES ACTIONS ============ */
function toLocalInput(ts){ var d=new Date(ts-(new Date().getTimezoneOffset()*60000)); return d.toISOString().slice(0,16); }
function parseAiJson(txt){ if(!txt)return null; try{ return JSON.parse(txt); }catch(e){} var m=txt.match(/\{[\s\S]*\}/); if(m){ try{ return JSON.parse(m[0]); }catch(e){} } return null; }
// >>> BOUTON 1 : recherche des matchs reels A VENIR via football-data.org, listes dans l'ordre.
// Recherche des matchs A VENIR (status=SCHEDULED) d'une competition via football-data.org v4.
Admin.apiSearch=function(){ var code=$("apLeague").value, nx=parseInt($("apNext").value||"15",10); State.loadingApi=true; $("availList").innerHTML=V.availableList();
  apiFootball("/competitions/"+code+"/matches?status=SCHEDULED").then(function(d){ var arr=(d&&d.matches)||[]; State.loadingApi=false; if(!arr.length){ State.available=[]; $("availList").innerHTML=V.availableList(); toast((d&&d.message)?(t("apiError")+" — "+d.message):t("noAvailable"),"err"); return; } State.available=arr.map(function(fx){ return { source:"api", verified:true, league:(fx.competition&&fx.competition.name)||"", teamA:(fx.homeTeam&&(fx.homeTeam.name||fx.homeTeam.shortName))||"", teamB:(fx.awayTeam&&(fx.awayTeam.name||fx.awayTeam.shortName))||"", kickoff:fx.utcDate?new Date(fx.utcDate).getTime():now()+864e5 }; }).filter(function(x){ return x.kickoff>now()&&x.teamA&&x.teamB; }).sort(function(x,y){return x.kickoff-y.kickoff;}).slice(0,nx); $("availList").innerHTML=V.availableList(); if(State.available.length===0)toast(t("noAvailable"),"err"); else toast(t("availableFound",{n:State.available.length}),"ok"); logAction("API_SEARCH",code+" ("+State.available.length+")"); }).catch(function(e){ console.error(e); State.loadingApi=false; State.available=[]; $("availList").innerHTML=V.availableList(); toast(t("apiError")+((e&&e.message)?(" — "+e.message):""),"err"); }); };
Admin.setSrcBadge=function(){ var el=$("srcBadge"); if(!el)return; var s=State.formSource||"manual"; if(s==="api"){ el.className="pill up"; el.innerHTML=ic("check","ico-sm")+t("verifiedApi"); } else if(s==="ai"){ el.className="pill lock"; el.innerHTML=ic("spark","ico-sm")+t("unverifiedAi"); } else { el.className="pill info"; el.textContent=t("manualEntry"); } };
Admin.useFixture=function(i){ var fx=State.available[i]; if(!fx||fx.used)return; $("nA").value=fx.teamA; $("nB").value=fx.teamB; $("nLg").value=fx.league; if(fx.kickoff)$("nKick").value=toLocalInput(fx.kickoff); State.formSource="api"; Admin.setSrcBadge(); fx.used=true; $("availList").innerHTML=V.availableList(); toast(t("formFilled"),"ok"); };
// >>> BOUTON 2 (icone IA) : Agnes voit les matchs dispo et remplit les cases du formulaire.
Admin.aiFill=function(){ var btn=$("btnAI"); if(btn)btn.disabled=true; toast(t("aiThinking"));
  // Anti-repetition: exclut les matchs deja crees + les dernieres suggestions IA.
  var excl={}; Object.keys(State.matches||{}).forEach(function(id){ var m=State.matches[id]; if(m&&m.teamA&&m.teamB)excl[keyOf(m.teamA,m.teamB)]=1; }); (State.aiRecent||[]).forEach(function(k){ excl[k]=1; });
  var avail=(State.available&&State.available.length)?State.available.slice(0,25).map(function(f){return {league:f.league,teamA:f.teamA,teamB:f.teamB,kickoff:new Date(f.kickoff).toISOString()};}):null;
  var nonce=Math.random().toString(36).slice(2,8);
  var userMsg=(avail?("Liste de matchs reels a venir (choisis-en UN): "+JSON.stringify(avail)):("Aucune liste API. Propose UN match reel plausible a venir (7 prochains jours) d'un grand championnat, en VARIANT le championnat et les equipes."))+" A EXCLURE absolument (deja proposes/publies): "+JSON.stringify(Object.keys(excl))+". Varie ta reponse (seed "+nonce+"). Date actuelle: "+new Date().toISOString()+". Renvoie uniquement le JSON.";
  function applyObj(o){ if(o.teamA)$("nA").value=o.teamA; if(o.teamB)$("nB").value=o.teamB; if(o.league)$("nLg").value=o.league; if(o.teamAColor&&/^#/.test(o.teamAColor))$("nCA").value=o.teamAColor; if(o.teamBColor&&/^#/.test(o.teamBColor))$("nCB").value=o.teamBColor; var ts=o.kickoff?Date.parse(o.kickoff):NaN; if(isNaN(ts)||ts<now())ts=now()+(1+Math.floor(Math.random()*5))*864e5; $("nKick").value=toLocalInput(ts); State.aiOdds={home:+o.oddsHome||2.2,draw:+o.oddsDraw||3.2,away:+o.oddsAway||2.8}; State.aiRecent=(State.aiRecent||[]); State.aiRecent.push(keyOf(o.teamA,o.teamB)); if(State.aiRecent.length>8)State.aiRecent.shift(); State.formSource="ai"; Admin.setSrcBadge(); }
  agnesChat([ {role:"system",content:AI_MATCH_SYSTEM}, {role:"user",content:userMsg} ],{temperature:0.9}).then(function(txt){ var o=parseAiJson(txt); if(!o||!o.teamA||!o.teamB){ applyObj(pickFallbackFixture(excl)); toast(t("aiFallback"),"err"); } else { applyObj(o); toast(t("aiFilled")+" — "+t("unverifiedAi"),"ok"); } if(btn)btn.disabled=false; }).catch(function(e){ console.error(e); applyObj(pickFallbackFixture(excl)); toast(t("aiFallback"),"err"); if(btn)btn.disabled=false; }); };
Admin.addMatch=function(){ var a=$("nA").value.trim(), b=$("nB").value.trim(), lg=$("nLg").value.trim()||"Match", ca=$("nCA").value, cb=$("nCB").value, k=$("nKick").value; if(!a||!b){ toast(t("teamA")+" / "+t("teamB"),"err"); return; } var kickoff=k?new Date(k).getTime():now()+864e5; if(kickoff<=now())toast(t("kickoffPast"),"err"); var id="m"+now(); var odds=State.aiOdds||{home:2.2,draw:3.2,away:2.8}; State.aiOdds=null; var src=State.formSource||"manual"; var wantThumb=$("nThumb")?$("nThumb").checked:false; var rec={id:id,league:lg,teamA:a,teamAColor:ca,teamB:b,teamBColor:cb,kickoff:kickoff,status:"upcoming",result:null,odds:odds,thumbnail:null,thumbPending:wantThumb,source:src,verified:(src==="api")}; DBX.write("matches/"+id,rec).then(function(){ logAction("ADD_MATCH",a+" vs "+b+" ["+src+"]"); toast(t("matchAdded"),"ok"); $("nA").value="";$("nB").value=""; State.formSource="manual"; if(wantThumb)Admin.genThumb(id,rec); }); };
// Genere une miniature de fond football (aucun texte) via Agnes puis la stocke sur le match.
Admin.genThumb=function(id,rec){ var m=rec||State.matches[id]; if(!m)return; toast(t("thumbGen")); DBX.update("matches/"+id,{thumbPending:true}); agnesImage(thumbnailPrompt(m)).then(function(url){ if(!url){ DBX.update("matches/"+id,{thumbPending:false}); toast(t("thumbError"),"err"); return; } DBX.update("matches/"+id,{thumbnail:url,thumbPending:false}).then(function(){ logAction("GEN_THUMB",m.teamA+" vs "+m.teamB); toast(t("thumbDone"),"ok"); }); }).catch(function(e){ console.error(e); DBX.update("matches/"+id,{thumbPending:false}); toast(t("thumbError"),"err"); }); };
Admin.deleteMatch=function(id){ if(!confirm("?"))return; var m=State.matches[id]; DBX.remove("matches/"+id).then(function(){ logAction("DELETE_MATCH",m?m.teamA+" vs "+m.teamB:id); }); };
Admin.openResult=function(id){ var m=State.matches[id]; if(!m)return; State.resultMatch=id; var r=m.result||{a:0,b:0}; openModal('<h3>'+ic("flag")+t("setResult")+'</h3><div class="muted" style="margin-bottom:14px">'+esc(m.teamA)+' vs '+esc(m.teamB)+'</div><div class="grid2"><div class="field"><label>'+t("scoreA")+' ('+esc(m.teamA)+')</label><input id="rA" type="number" min="0" value="'+r.a+'" /></div><div class="field"><label>'+t("scoreB")+' ('+esc(m.teamB)+')</label><input id="rB" type="number" min="0" value="'+r.b+'" /></div></div><div class="row"><button class="btn" onclick="Admin.saveResult()">'+ic("save","ico-sm")+t("saveResult")+'</button><button class="btn btn-ghost" onclick="closeModal()">'+t("cancel")+'</button></div>'); };
Admin.saveResult=function(){ var id=State.resultMatch, a=parseInt($("rA").value,10)||0, b=parseInt($("rB").value,10)||0; DBX.update("matches/"+id,{result:{a:a,b:b},status:"finished"}).then(function(){ var m=State.matches[id]; logAction("SET_RESULT",m.teamA+" "+a+"-"+b+" "+m.teamB); toast(t("resultSaved"),"ok"); closeModal(); }); };

/* ---- SETTLE PREDICTIONS (auto-credit) ---- */
function evalPred(p,res){ var wins={}; var winner=res.a>res.b?"home":res.a<res.b?"away":"draw"; var total=res.a+res.b; var r=State.rules||DEFAULT_RULES; var payout=0;
  if(p.winner){ wins.winner=(p.winner===winner); if(wins.winner)payout+=r.rewardWinner; }
  if(p.exact){ wins.exact=(p.exact.a===res.a&&p.exact.b===res.b); if(wins.exact)payout+=r.rewardExactScore; }
  if(p.totals){ var ok=p.totals==="over"?total>2.5:p.totals==="under"?total<2.5:(total===2||total===3); wins.totals=ok; if(ok)payout+=r.rewardTotals; }
  if(p.btts){ var both=(res.a>0&&res.b>0)?"yes":"no"; wins.btts=(p.btts===both); if(wins.btts)payout+=r.rewardBtts; }
  var anyWin=Object.keys(wins).some(function(k){return wins[k];}); return {payout:payout,won:anyWin}; }
Admin.settle=function(matchId){ var m=State.matches[matchId]; if(!m||!m.result){ toast(t("needResult"),"err"); return; }
  var users=State.users||{}, settled=0, credited=0, chain=Promise.resolve();
  Object.keys(users).forEach(function(uid){ var u=users[uid]; var preds=u.predictions||{}; var p=preds[matchId]; if(!p||p.settled)return; (function(uid,u,preds,p){ chain=chain.then(function(){ var ev=evalPred(p,m.result); preds[matchId]=Object.assign({},p,{settled:true,won:ev.won,payout:ev.payout}); var st=u.stats||{totalPredictions:0,won:0,lost:0,winRate:0}; if(ev.won)st.won=(st.won||0)+1; else st.lost=(st.lost||0)+1; st.winRate=st.totalPredictions?Math.round((st.won/st.totalPredictions)*100):0; settled++; credited+=ev.payout; var upd={predictions:preds,stats:st}; if(ev.payout>0)upd.coins=(u.coins||0)+ev.payout; return DBX.update("users/"+uid,upd).then(function(){ return pushNotifTo(uid,ev.won?"win":"system",ev.won?(LANG==="fr"?"Pronostic gagné !":"Prediction won!"):(LANG==="fr"?"Pronostic réglé":"Prediction settled"),m.teamA+" "+m.result.a+"-"+m.result.b+" "+m.teamB+(ev.payout>0?(" · +"+ev.payout):"")); }); }); })(uid,u,preds,p); });
  chain.then(function(){ logAction("SETTLE",m.teamA+" vs "+m.teamB+" ("+settled+")"); toast(settled+" "+t("settleDone")+" (+"+credited+")","ok"); }); };

/* ============ RULES ============ */
Admin.saveRules=function(){ var keys=["dailyReward","referralBonus","exchangeRate","minWithdrawal","entryFee","rewardWinner","rewardExactScore","rewardTotals","rewardBtts"]; var r={}; keys.forEach(function(k){ r[k]=parseInt($(k).value,10)||0; }); DBX.write("config/rules",r).then(function(){ logAction("SAVE_RULES",""); toast(t("rulesSaved"),"ok"); }); };

/* ============ MISSIONS ============ */
Admin.openMission=function(id){ var m=id?State.missions[id]:{id:"m"+now(),title:"",titleEn:"",reward:50,url:"",active:true}; State.editMission=m.id; openModal('<h3>'+ic("gift")+(id?t("edit"):t("newMission"))+'</h3><div class="field"><label>'+t("missionTitleFr")+'</label><input id="mT" value="'+esc(m.title)+'" /></div><div class="field"><label>'+t("missionTitleEn")+'</label><input id="mTe" value="'+esc(m.titleEn||"")+'" /></div><div class="grid2"><div class="field"><label>'+t("reward")+'</label><input id="mR" type="number" value="'+m.reward+'" /></div><div class="field"><label>'+t("activeQ")+'</label><select id="mAc"><option value="1" '+(m.active?"selected":"")+'>'+t("active")+'</option><option value="0" '+(!m.active?"selected":"")+'>off</option></select></div></div><div class="field"><label>'+t("link")+'</label><input id="mU" value="'+esc(m.url||"")+'" placeholder="#ad, #predict, https://…" /></div><div class="row"><button class="btn" onclick="Admin.saveMission()">'+ic("save","ico-sm")+t("save")+'</button><button class="btn btn-ghost" onclick="closeModal()">'+t("cancel")+'</button></div>'); };
Admin.saveMission=function(){ var id=State.editMission; var rec={id:id,title:$("mT").value.trim(),titleEn:$("mTe").value.trim(),reward:parseInt($("mR").value,10)||0,url:$("mU").value.trim(),active:$("mAc").value==="1"}; DBX.write("config/missions/"+id,rec).then(function(){ logAction("SAVE_MISSION",rec.title); toast(t("missionSaved"),"ok"); closeModal(); }); };
Admin.deleteMission=function(id){ if(!confirm("?"))return; DBX.remove("config/missions/"+id).then(function(){ logAction("DELETE_MISSION",id); toast(t("missionDeleted"),"ok"); }); };

/* ============ WITHDRAWALS ============ */
function updUserWithdrawal(uid,wid,status){ return DBX.read("users/"+uid+"/withdrawals").then(function(l){ l=normArr(l); l.forEach(function(w){ if(w.id===wid)w.status=status; }); return DBX.write("users/"+uid+"/withdrawals",l); }); }
Admin.approveWd=function(wid){ if(!confirm(t("approveConfirm")))return; var w=State.withdrawals[wid]; if(!w)return; DBX.update("withdrawals/"+wid,{status:"approved"}).then(function(){ return updUserWithdrawal(w.uid,wid,"approved"); }).then(function(){ return pushNotifTo(w.uid,"gain",LANG==="fr"?"Retrait approuvé":"Payout approved",w.amount+" · "+w.method); }).then(function(){ logAction("APPROVE_WD",w.username+" "+w.amount); toast(t("wdApproved"),"ok"); }); };
Admin.rejectWd=function(wid){ if(!confirm(t("rejectConfirm")))return; var w=State.withdrawals[wid]; if(!w)return; var u=State.users[w.uid]; var refund=(u?(u.coins||0):0)+w.amount; DBX.update("withdrawals/"+wid,{status:"rejected"}).then(function(){ return updUserWithdrawal(w.uid,wid,"rejected"); }).then(function(){ return DBX.update("users/"+w.uid,{coins:refund}); }).then(function(){ return pushNotifTo(w.uid,"system",LANG==="fr"?"Retrait rejeté":"Payout rejected",(LANG==="fr"?"Pièces remboursées : ":"Coins refunded: ")+w.amount); }).then(function(){ logAction("REJECT_WD",w.username+" "+w.amount); toast(t("wdRejected"),"ok"); }); };

/* ============ BROADCAST ============ */
Admin.broadcast=function(){ var title=$("bcT").value.trim(), msg=$("bcM").value.trim(), img=$("bcI").value.trim(); if(!title||!msg){ toast(t("bcEmpty"),"err"); return; } var users=State.users||{}, uids=Object.keys(users).filter(function(k){return users[k].username!=="admin";}), chain=Promise.resolve(); uids.forEach(function(uid){ chain=chain.then(function(){ return pushNotifTo(uid,"announce",title,msg,img||null); }); }); chain.then(function(){ logAction("BROADCAST",title); toast(t("bcSent",{n:uids.length}),"ok"); $("bcT").value="";$("bcM").value="";$("bcI").value=""; }); };

/* ============ SETTINGS / API / LOGS ============ */
Admin.saveSettings=function(){ var s={ telegramChannel:$("sTg").value.trim(), monetagZone:$("sMz").value.trim(), apiEnabled:$("sApiEn").value==="1", apiKey:$("sApiKey").value.trim() }; DBX.write("config/system",s).then(function(){ FOOTBALL_API.ENABLED=s.apiEnabled; if(s.apiKey)FOOTBALL_API.KEY=s.apiKey; logAction("SAVE_SETTINGS",""); toast(t("settingsSaved"),"ok"); }); };
Admin.clearLogs=function(){ DBX.write("logs",[]).then(function(){ toast("OK","ok"); }); };
Admin.apiSync=function(){ var s=State.system||DEFAULT_SYSTEM; if(!s.apiEnabled||!s.apiKey||s.apiKey==="YOUR_FOOTBALL_API_KEY"){ toast(t("apiDisabled"),"err"); return; }
  /* [PASTE_FOOTBALL_API_KEY] Exemple d'appel football-data.org (matchs du jour) :
     fetch(FOOTBALL_API.BASE+"/matches?dateFrom=YYYY-MM-DD&dateTo=YYYY-MM-DD",{headers:{"X-Auth-Token":s.apiKey}})
       .then(function(r){return r.json();}).then(function(d){ (d.matches||[]).forEach(function(fx){ ... mapper vers matches/<id> ... }); }); */
  toast("API sync — "+(LANG==="fr"?"branche l'appel fetch ici":"wire fetch call here"),"ok"); logAction("API_SYNC",""); };

/* ============ BOOT ============ */
Admin.boot();
</script>
</body>
</html>
