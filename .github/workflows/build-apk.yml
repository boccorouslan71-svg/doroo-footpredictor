name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparer Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Construire l'APK de debug
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Publier l'APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: doroo-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Creer/actualiser la Release avec l'APK telechargeable
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "DOROO FootPredictor ${TAG}" \
            --notes "Application mobile Android (installez l'APK directement).
Serveur web : https://github.com/${GITHUB_REPOSITORY}" \
            "${APK}"
        env:
          GH_TOKEN: ${{ github.token }}